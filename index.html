<script>
const OPS={'+':'Qo‘shish','-':'Ayirish','×':'Ko‘paytirish','÷':'Bo‘lish','r':'Qoldiqli bo‘lish','%':'Foizlar','f':'Kasrlar','x':'Tenglamalar','p':'Qavsli misollar','n':'Manfiy sonlar','d':'O‘nli kasrlar','g':'Geometriya','?':'Aralash (hamma amallar)'};
const SYM={'+':'+','-':'−','×':'×','÷':'÷','r':'÷r','%':'%','x':'x=','p':'( )','f':'½','n':'−5','d':'0,5','g':'△','?':'±'};
const MAXN=[5,10,20,50,100,200,500,1000,5000,10000,100000];
const MUL=[[0,3,0,3],[2,5,2,5],[2,10,2,10],[2,12,2,12],[11,20,2,9],[11,50,2,9],[11,99,2,9],[11,99,11,30],[100,999,2,9],[100,999,11,50],[100,999,11,99]];
const DIV=[[1,3,1,3],[2,5,2,5],[2,10,2,10],[2,12,2,12],[2,9,11,30],[2,9,11,99],[11,30,11,30],[11,50,11,50],[2,9,100,999],[11,50,100,300],[11,99,100,999]];
const NAMES=['birlar','o‘nlar','yuzlar','minglar','o‘n minglar','yuz minglar','millionlar'];
let op='+',mode='learn',lvl=1,cur=null,answered=false,armed=false,hinted=false;
const NEW=()=>({ok:0,streak:0,best:0,pts:0,p:{},miss:[],day:'',dayN:0,dstr:0,lastGoal:'',bt:{},os:{},ach:[],h:{},goal:20,onlyMiss:false,big:false,rc:{},n:0,dur:60,theme:'auto',snd:true,story:false});
let S=NEW();
let META={act:'p1',list:[{id:'p1',n:'Asosiy'}]};
try{const m=JSON.parse(localStorage.getItem('hisob_meta')||'null');if(m&&Array.isArray(m.list)){const l=m.list.filter(x=>x&&/^p\d{1,3}$/.test(x.id)&&typeof x.n==='string').map(x=>({id:x.id,n:x.n.replace(/[<>]/g,'').slice(0,12)})).slice(0,8);if(l.length)META={act:l.some(x=>x.id===m.act)?m.act:l[0].id,list:l}}}catch(e){}
const SK=META.act==='p1'?'hisob2':'hisob2_'+META.act;
function saveMeta(){try{localStorage.setItem('hisob_meta',JSON.stringify(META))}catch(e){}}
try{const s=JSON.parse(localStorage.getItem(SK)||'null');if(s)Object.keys(NEW()).forEach(k=>{if(Object.prototype.hasOwnProperty.call(s,k))S[k]=s[k]})}catch(e){}
try{const num=v=>Number.isFinite(v)?v:0;['ok','streak','best','pts','dayN','dstr','n'].forEach(k=>S[k]=num(S[k]));if(!S.p||typeof S.p!=='object'||Array.isArray(S.p))S.p={};if(!S.bt||typeof S.bt!=='object'||Array.isArray(S.bt))S.bt={};S.miss=Array.isArray(S.miss)?S.miss.filter(m=>m&&OPS[m.o]&&m.o!=='?'&&Number.isFinite(m.a)&&Number.isFinite(m.b)).slice(0,20):[];if(![30,60,120].includes(S.dur))S.dur=60;if(S.n<S.ok)S.n=S.ok;if(!S.os||typeof S.os!=='object'||Array.isArray(S.os))S.os={};if(!Array.isArray(S.ach))S.ach=[];if(!S.h||typeof S.h!=='object'||Array.isArray(S.h))S.h={}}catch(e){S=NEW()}
try{clean()}catch(e){S=NEW()}
function clean(){
  const I=(v,lo,hi,d)=>Number.isInteger(v)&&v>=lo&&v<=hi?v:d,D=/^\d{4}-\d{2}-\d{2}$/;
  ['ok','streak','best','pts','dayN','dstr','n'].forEach(k=>S[k]=I(S[k],0,1e9,0));
  if(S.n<S.ok)S.n=S.ok;
  S.day=D.test(S.day)?S.day:'';S.lastGoal=D.test(S.lastGoal)?S.lastGoal:'';
  const M=(o,rx,hi)=>{const r={};if(o&&typeof o==='object'&&!Array.isArray(o))Object.keys(o).forEach(k=>{if(rx.test(k)&&Number.isInteger(o[k])&&o[k]>=0&&o[k]<=hi)r[k]=o[k]});return r};
  S.p=M(S.p,/^[+\-×÷r%fxpndg?]\d{1,2}$/,1e9);S.bt=M(S.bt,/^[+\-×÷r%fxpndg?]\d{1,2}_\d{2,3}$/,1e6);S.h=M(S.h,D,1e6);{const r={};if(S.rc&&typeof S.rc==='object'&&!Array.isArray(S.rc))Object.keys(S.rc).forEach(k=>{if(/^[+\-×÷r%fxpndg?]\d{1,2}$/.test(k)&&Array.isArray(S.rc[k]))r[k]=S.rc[k].filter(v=>v===0||v===1).slice(-10)});S.rc=r}
  const os={};if(S.os&&typeof S.os==='object')Object.keys(OPS).forEach(o=>{const x=S.os[o];if(x&&Number.isInteger(x.n)&&Number.isInteger(x.ok)&&x.ok>=0&&x.ok<=x.n&&x.n<=1e9)os[o]={n:x.n,ok:x.ok}});S.os=os;
  S.ach=Array.isArray(S.ach)?[...new Set(S.ach.filter(x=>typeof x==='string'&&/^[a-z]\d$/.test(x)))]:[];
  S.snd=S.snd!==false;S.story=S.story===true;S.onlyMiss=S.onlyMiss===true;S.big=S.big===true;
  if(!['auto','light','dark'].includes(S.theme))S.theme='auto';
  if(![30,60,120].includes(S.dur))S.dur=60;if(![10,20,50].includes(S.goal))S.goal=20;
  S.miss=Array.isArray(S.miss)?S.miss.map(rebuild).filter(Boolean).slice(0,20):[];
}
function rebuild(m){
  if(!m||typeof m!=='object'||!OPS[m.o]||m.o==='?')return null;
  const I=(v,lo,hi)=>Number.isInteger(v)&&v>=lo&&v<=hi,g=(x,y)=>y?g(y,x%y):x,o=m.o;let q;
  if('ndg'.includes(o)){q=rb2(m)}else if(o==='f'){
    if(!Array.isArray(m.f)||m.f.length!==5)return null;
    const[n1,d1,n2,d2,s]=m.f;if(![n1,d1,n2,d2].every(v=>I(v,1,999))||!['+','−','×','÷'].includes(s))return null;
    let num,den,l=0;
    if(s==='+'||s==='−'){l=d1*d2/g(d1,d2);const a1=n1*l/d1,a2=n2*l/d2;if(s==='−'&&a1<=a2)return null;num=s==='+'?a1+a2:a1-a2;den=l}
    else if(s==='×'){num=n1*n2;den=d1*d2}else{num=n1*d2;den=d1*n2}
    const gg=g(num,den),fr=[num/gg,den/gg];
    q={o,a:0,b:0,r:fr[0],f:[n1,d1,n2,d2,s],raw:[num,den],l,fr,ans:fr,lab:['surat','maxraj']};
  }else{
    const a=m.a,b=m.b;if(!I(a,0,1e6)||!I(b,0,1e6))return null;
    if(o==='+')q={o,a,b,r:a+b};
    else if(o==='-'){if(a<b)return null;q={o,a,b,r:a-b}}
    else if(o==='×')q={o,a,b,r:a*b};
    else if(o==='÷'){if(b<1||a%b)return null;q={o,a,b,r:a/b}}
    else if(o==='p'){const t=m.t,c=m.c;if(!I(t,0,3)||!I(c,2,1e4)||a<1||b<1)return null;let r;if(t===0)r=a+b*c;else if(t===1)r=(a+b)*c;else if(t===2){r=a*b-c;if(r<0)return null}else{if(a<=b)return null;r=(a-b)*c}q={o,t,a,b,c,r,ans:[r],lab:['']}}
    else if(o==='x'){const t=m.t;if(!I(t,0,3))return null;if(t===0){if(b<a)return null;q={o,t,a,b,r:b-a}}else if(t===1)q={o,t,a,b,r:a+b};else if(t===2){if(a<1||b%a)return null;q={o,t,a,b,r:b/a}}else{if(a<1)return null;q={o,t,a,b,r:a*b}}q.ans=[q.r];q.lab=['']}
    else if(o==='r'){if(b<2||a<b||a%b===0)return null;q={o,a,b,r:Math.floor(a/b),ans:[Math.floor(a/b),a%b],lab:['bo‘linma','qoldiq']}}
    else{if(!I(a,1,99)||b<1||(b*a)%100)return null;q={o,a,b,r:b*a/100,ans:[b*a/100],lab:['']}}
  }
  if(!q)return null;if(I(m.lv,0,10))q.lv=m.lv;return q;
}
let ready=false,saveBad=false;function save(){try{localStorage.setItem(SK,JSON.stringify(S));saveBad=false}catch(e){saveBad=true}}
const $=id=>document.getElementById(id);
const ent=f=>e=>{if(e.key==='Enter'){const i=$('in2');if(i&&!i.value&&!i.disabled)i.focus();else f()}};
document.addEventListener('input',e=>{if(e.target.matches('.ans input'))e.target.value=e.target.value.replace(op==='n'||op==='d'?/[^\d,.\-−]/g:/\D/g,'')});
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u202f');
const dots=(n,c='')=>Array.from({length:n},()=>`<span class="d ${c}"></span>`).join('');
const key=i=>op+i;

function steps(q){
  const{o,a,b,r}=q,L=[];
  if(o==='+'){

    if(c)L.push('Oxirida 1 qoldi, uni oldinga yozamiz.');
  }else if(o==='-'){

    for(let i=0;i<A.length;i++){const x=A[i],y=B[i]||0,raw=x-bo,need=raw<y,v=raw+(need?10:0);
      L.push(`${nm(i)}: ${x}${bo?' − 1':''}${need?' + 10':''} − ${y} = ${v-y}`+(need?' (keyingi xonadan 10 qarz oldik)':''));bo=need?1:0}

    let rem=0,go=false;
